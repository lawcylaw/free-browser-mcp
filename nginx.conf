worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 7860;
        server_name _;

        location = /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location /desktop/mcp {
            proxy_pass http://127.0.0.1:8002/desktop/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Type application/json;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /mcp {
            proxy_pass http://127.0.0.1:8001/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Type application/json;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /sse {
            proxy_pass http://127.0.0.1:8000/sse;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /message {
            proxy_pass http://127.0.0.1:8000/message;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Content-Type application/json;
            proxy_read_timeout 300s;
        }

        location = / {
            return 302 /vnc/vnc.html?autoconnect=true&resize=scale&path=vnc/websockify;
        }

        location /vnc/ {
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
    }
}
