[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xfce]
command=/usr/bin/startxfce4
environment=DISPLAY=":99",HOME="/root"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/bin/bash -c "if [ -n \"$VNC_PASSWORD\" ]; then exec /usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -passwd \"$VNC_PASSWORD\"; else exec /usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw; fi"
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 127.0.0.1:5900
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp]
command=npx -y supergateway --stdio "npx @playwright/mcp@latest --no-sandbox --user-data-dir /data/chrome-profile --viewport-size 1280,800" --port 8000 --ssePath /sse --messagePath /message
environment=DISPLAY=":99"
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp_http]
command=npx -y supergateway --stdio "npx @playwright/mcp@latest --no-sandbox --user-data-dir /data/chrome-profile --viewport-size 1280,800" --outputTransport streamableHttp --port 8001 --streamableHttpPath /mcp
environment=DISPLAY=":99"
autorestart=true
priority=55
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:desktop_mcp]
command=/usr/bin/node /app/desktop-mcp.mjs
directory=/app
environment=DISPLAY=":99",DESKTOP_MCP_PORT="8002"
autorestart=true
priority=58
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
